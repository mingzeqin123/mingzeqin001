<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 自动邮件发送</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 500px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .form-container {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input.error {
            border-color: #dc3545;
            background: #fff5f5;
        }

        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .features {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .features h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .features ul {
            list-style: none;
            padding: 0;
        }

        .features li {
            color: #666;
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #28a745;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎉 用户注册</h1>
            <p>注册成功后，系统将自动发送账户信息到您的邮箱</p>
        </div>
        
        <div class="form-container">
            <div class="success-message" id="successMessage">
                <strong>注册成功！</strong> 您的账户信息已发送到邮箱，请查收邮件获取登录信息。
            </div>
            
            <form id="registrationForm">
                <div class="form-group">
                    <label for="username">用户名 *</label>
                    <input type="text" id="username" name="username" required>
                    <div class="error-message" id="usernameError"></div>
                </div>
                
                <div class="form-group">
                    <label for="email">邮箱地址 *</label>
                    <input type="email" id="email" name="email" required>
                    <div class="error-message" id="emailError"></div>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="btnText">立即注册</span>
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                    </div>
                </button>
            </form>
            
            <div class="features">
                <h3>注册后您将收到：</h3>
                <ul>
                    <li>您的用户名和随机生成的密码</li>
                    <li>系统登录地址</li>
                    <li>详细的使用说明</li>
                    <li>安全提示和注意事项</li>
                </ul>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2024 用户注册系统. 所有权利保留.</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loading = document.getElementById('loading');
        const successMessage = document.getElementById('successMessage');
        
        // 表单验证
        function validateForm() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            let isValid = true;
            
            // 清除之前的错误
            clearErrors();
            
            // 验证用户名
            if (!username) {
                showError('usernameError', '请输入用户名');
                isValid = false;
            } else if (username.length < 3) {
                showError('usernameError', '用户名至少需要3个字符');
                isValid = false;
            }
            
            // 验证邮箱
            if (!email) {
                showError('emailError', '请输入邮箱地址');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showError('emailError', '请输入有效的邮箱地址');
                isValid = false;
            }
            
            return isValid;
        }
        
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        function showError(errorId, message) {
            const errorElement = document.getElementById(errorId);
            const inputElement = errorElement.previousElementSibling;
            
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            inputElement.classList.add('error');
        }
        
        function clearErrors() {
            const errorElements = document.querySelectorAll('.error-message');
            const inputElements = document.querySelectorAll('input');
            
            errorElements.forEach(error => {
                error.style.display = 'none';
                error.textContent = '';
            });
            
            inputElements.forEach(input => {
                input.classList.remove('error');
            });
        }
        
        function setLoading(loading) {
            if (loading) {
                submitBtn.disabled = true;
                btnText.style.opacity = '0';
                document.getElementById('loading').style.display = 'block';
            } else {
                submitBtn.disabled = false;
                btnText.style.opacity = '1';
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        // 表单提交
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!validateForm()) {
                return;
            }
            
            setLoading(true);
            clearErrors();
            
            try {
                const formData = new FormData(form);
                const data = {
                    username: formData.get('username').trim(),
                    email: formData.get('email').trim()
                };
                
                const response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    successMessage.classList.add('show');
                    form.reset();
                    // 滚动到顶部显示成功消息
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    if (result.message.includes('邮箱')) {
                        showError('emailError', result.message);
                    } else {
                        showError('usernameError', result.message);
                    }
                }
                
            } catch (error) {
                console.error('注册错误:', error);
                showError('emailError', '网络错误，请检查服务器是否运行');
            } finally {
                setLoading(false);
            }
        });
        
        // 输入时清除错误状态
        document.getElementById('username').addEventListener('input', () => {
            document.getElementById('username').classList.remove('error');
            document.getElementById('usernameError').style.display = 'none';
        });
        
        document.getElementById('email').addEventListener('input', () => {
            document.getElementById('email').classList.remove('error');
            document.getElementById('emailError').style.display = 'none';
        });
    </script>
</body>
</html>
