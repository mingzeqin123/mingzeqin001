# Fluent Bit 日志收集配置

[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/app/*.log
    Parser            json
    Tag               app.logs
    Refresh_Interval  5

[INPUT]
    Name              tail
    Path              /var/log/app/build.log
    Parser            multiline
    Tag               app.build
    Multiline.parser  multiline

[INPUT]
    Name              tail
    Path              /var/log/app/deploy.log
    Parser            multiline
    Tag               app.deploy
    Multiline.parser  multiline

[FILTER]
    Name                kubernetes
    Match               app.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix     app.
    Merge_Log           On
    Keep_Log            Off

[OUTPUT]
    Name  forward
    Match app.*
    Host  log-aggregator
    Port  24224

[OUTPUT]
    Name  stdout
    Match app.*
    Format json_lines