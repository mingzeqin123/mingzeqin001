[supervisord]
nodaemon=true
user=root
logfile=/var/log/app/supervisord.log
pidfile=/var/run/supervisord.pid

[program:cron]
command=/usr/sbin/cron -f
stdout_logfile=/var/log/app/cron.log
stderr_logfile=/var/log/app/cron.log
autorestart=true
priority=100

[program:app-service]
command=/app/scripts/start-service.sh
directory=/app
user=appuser
stdout_logfile=/var/log/app/app.log
stderr_logfile=/var/log/app/app.log
autorestart=true
priority=200

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface