# 微信支付配置
# 请根据您的实际情况修改以下配置

# 微信分配的公众账号ID
wechat.pay.app.id=your_app_id

# 微信支付分配的商户号
wechat.pay.mch.id=your_mch_id

# API密钥，在商户平台设置
wechat.pay.api.key=your_api_key

# 支付结果通知地址
wechat.pay.notify.url=http://your-domain.com/notify

# 证书路径（退款时需要）
wechat.pay.cert.path=/path/to/your/cert.p12

# 交易类型
wechat.pay.trade.type=NATIVE

# 字符编码
wechat.pay.charset=UTF-8

# 签名类型
wechat.pay.sign.type=MD5