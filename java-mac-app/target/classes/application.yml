# Spring Boot应用配置
spring:
  application:
    name: distributed-lock-demo
  
  # Web服务器配置（可选）
  server:
    port: 8080
    servlet:
      context-path: /
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: # 如果有密码请填写
    database: 0
    timeout: 2000ms
    
    # Lettuce连接池配置
    lettuce:
      pool:
        max-active: 20     # 连接池最大连接数
        max-idle: 10       # 连接池最大空闲连接数
        min-idle: 5        # 连接池最小空闲连接数
        max-wait: 2000ms   # 连接池最大阻塞等待时间

# 应用自定义配置
app:
  enable-test-controller: true  # 是否启用测试控制器

# 日志配置
logging:
  level:
    com.example: DEBUG
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/distributed-lock-demo.log

# 管理端点配置（可选，用于监控）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always