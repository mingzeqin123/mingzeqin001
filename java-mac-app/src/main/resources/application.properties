# Spring Boot Configuration for MidJourney Parameter Builder

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# JSON Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration
logging.level.com.example.app=INFO
logging.level.org.springframework.web=INFO

# Application Information
spring.application.name=MidJourney Parameter Builder
info.app.name=MidJourney Parameter Builder
info.app.description=A web application for building MidJourney parameters
info.app.version=1.0.0

# CORS Configuration (handled in controller)
# Disable default CORS to use custom configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*