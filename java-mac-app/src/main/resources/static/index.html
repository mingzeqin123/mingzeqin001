<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidJourney 参数构建器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --dark-color: #1f2937;
            --light-color: #f9fafb;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            max-width: 1200px;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 30px;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .form-section {
            padding: 30px;
        }

        .section-title {
            color: var(--dark-color);
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-control, .form-select {
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.25);
        }

        .btn-custom {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            color: white;
        }

        .btn-preset {
            background: linear-gradient(135deg, var(--success-color), #059669);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 500;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .btn-preset:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
            color: white;
        }

        .result-section {
            background: var(--light-color);
            border: 2px solid #e5e7eb;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
        }

        .command-output {
            background: var(--dark-color);
            color: #10b981;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary-color);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: var(--secondary-color);
        }

        .parameter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .parameter-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .parameter-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .parameter-card h6 {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .range-container {
            position: relative;
            margin: 15px 0;
        }

        .range-input {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e5e7eb;
            outline: none;
            -webkit-appearance: none;
        }

        .range-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(99, 102, 241, 0.3);
        }

        .range-value {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-color);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .alert-custom {
            border: none;
            border-radius: 10px;
            padding: 15px 20px;
            font-weight: 500;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner-border {
            color: var(--primary-color);
        }

        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .main-container {
                margin: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .form-section {
                padding: 20px;
            }
            
            .parameter-grid {
                grid-template-columns: 1fr;
            }
        }

        .tooltip-icon {
            color: var(--primary-color);
            cursor: help;
            margin-left: 5px;
        }

        .advanced-toggle {
            background: none;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .advanced-toggle:hover {
            background: var(--primary-color);
            color: white;
        }

        .advanced-section {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .advanced-section.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="main-container">
            <!-- 头部 -->
            <div class="header">
                <h1><i class="fas fa-magic"></i> MidJourney 参数构建器</h1>
                <p>轻松构建专业的 MidJourney 提示词和参数</p>
            </div>

            <!-- 主要内容 -->
            <div class="form-section">
                <!-- 预设模板 -->
                <div class="section-title">
                    <i class="fas fa-palette"></i>
                    快速预设
                </div>
                <div class="preset-buttons">
                    <button class="btn btn-preset" onclick="loadPreset('portrait')">
                        <i class="fas fa-user"></i> 人像摄影
                    </button>
                    <button class="btn btn-preset" onclick="loadPreset('landscape')">
                        <i class="fas fa-mountain"></i> 风景摄影
                    </button>
                    <button class="btn btn-preset" onclick="loadPreset('anime')">
                        <i class="fas fa-star"></i> 动漫风格
                    </button>
                    <button class="btn btn-preset" onclick="loadPreset('realistic')">
                        <i class="fas fa-camera"></i> 写实风格
                    </button>
                    <button class="btn btn-preset" onclick="loadPreset('abstract')">
                        <i class="fas fa-shapes"></i> 抽象艺术
                    </button>
                    <button class="btn btn-preset" onclick="loadPreset('minimalist')">
                        <i class="fas fa-minus"></i> 极简主义
                    </button>
                </div>

                <!-- 基础参数 -->
                <div class="parameter-grid">
                    <!-- 主要提示词 -->
                    <div class="parameter-card">
                        <h6><i class="fas fa-edit"></i> 主要提示词</h6>
                        <textarea class="form-control" id="prompt" rows="3" 
                                placeholder="描述你想要生成的图像..."></textarea>
                        <button class="btn btn-sm btn-outline-primary mt-2" onclick="getSuggestions()">
                            <i class="fas fa-lightbulb"></i> 智能建议
                        </button>
                    </div>

                    <!-- 负面提示词 -->
                    <div class="parameter-card">
                        <h6><i class="fas fa-ban"></i> 负面提示词</h6>
                        <textarea class="form-control" id="negativePrompt" rows="2" 
                                placeholder="不想要的元素..."></textarea>
                    </div>

                    <!-- 宽高比 -->
                    <div class="parameter-card">
                        <h6><i class="fas fa-expand-arrows-alt"></i> 宽高比</h6>
                        <select class="form-select" id="aspectRatio">
                            <option value="SQUARE">1:1 正方形</option>
                            <option value="PORTRAIT_4_5">4:5 竖屏</option>
                            <option value="PORTRAIT_2_3">2:3 竖屏</option>
                            <option value="PORTRAIT_9_16">9:16 竖屏</option>
                            <option value="LANDSCAPE_5_4">5:4 横屏</option>
                            <option value="LANDSCAPE_3_2">3:2 横屏</option>
                            <option value="LANDSCAPE_16_9">16:9 横屏</option>
                            <option value="ULTRAWIDE_21_9">21:9 超宽屏</option>
                        </select>
                    </div>

                    <!-- 图像质量 -->
                    <div class="parameter-card">
                        <h6><i class="fas fa-gem"></i> 图像质量</h6>
                        <select class="form-select" id="quality">
                            <option value="LOW">低质量 (快速)</option>
                            <option value="STANDARD" selected>标准质量</option>
                            <option value="HIGH">高质量 (慢速)</option>
                        </select>
                    </div>

                    <!-- 风格化程度 -->
                    <div class="parameter-card">
                        <h6><i class="fas fa-brush"></i> 风格化程度</h6>
                        <div class="range-container">
                            <input type="range" class="range-input" id="stylize" 
                                   min="0" max="1000" value="100" 
                                   oninput="updateRangeValue('stylize', this.value)">
                            <div class="range-value" id="stylizeValue">100</div>
                        </div>
                        <small class="text-muted">0 = 更真实，1000 = 更艺术化</small>
                    </div>

                    <!-- 混乱度 -->
                    <div class="parameter-card">
                        <h6><i class="fas fa-random"></i> 混乱度</h6>
                        <div class="range-container">
                            <input type="range" class="range-input" id="chaos" 
                                   min="0" max="100" value="0" 
                                   oninput="updateRangeValue('chaos', this.value)">
                            <div class="range-value" id="chaosValue">0</div>
                        </div>
                        <small class="text-muted">0 = 更一致，100 = 更多变</small>
                    </div>
                </div>

                <!-- 高级参数切换 -->
                <button class="btn advanced-toggle" onclick="toggleAdvanced()">
                    <i class="fas fa-cog"></i> 高级参数
                </button>

                <!-- 高级参数 -->
                <div class="advanced-section" id="advancedSection">
                    <div class="parameter-grid">
                        <!-- 随机种子 -->
                        <div class="parameter-card">
                            <h6><i class="fas fa-dice"></i> 随机种子</h6>
                            <div class="input-group">
                                <input type="number" class="form-control" id="seed" placeholder="留空则随机">
                                <button class="btn btn-outline-primary" onclick="generateRandomSeed()">
                                    <i class="fas fa-random"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 模型版本 -->
                        <div class="parameter-card">
                            <h6><i class="fas fa-microchip"></i> 模型版本</h6>
                            <select class="form-select" id="model">
                                <option value="6" selected>Version 6 (最新)</option>
                                <option value="5.2">Version 5.2</option>
                                <option value="5.1">Version 5.1</option>
                                <option value="5">Version 5</option>
                                <option value="niji">Niji (动漫专用)</option>
                            </select>
                        </div>

                        <!-- 艺术风格 -->
                        <div class="parameter-card">
                            <h6><i class="fas fa-paint-brush"></i> 艺术风格</h6>
                            <select class="form-select" id="artStyle">
                                <option value="">选择风格...</option>
                                <option value="photorealistic">写实摄影</option>
                                <option value="anime style">动漫风格</option>
                                <option value="oil painting">油画</option>
                                <option value="watercolor">水彩画</option>
                                <option value="digital art">数字艺术</option>
                                <option value="pencil sketch">铅笔素描</option>
                                <option value="abstract">抽象艺术</option>
                                <option value="minimalist">极简主义</option>
                            </select>
                        </div>

                        <!-- 光照风格 -->
                        <div class="parameter-card">
                            <h6><i class="fas fa-sun"></i> 光照风格</h6>
                            <select class="form-select" id="lightingStyle">
                                <option value="">选择光照...</option>
                                <option value="natural lighting">自然光</option>
                                <option value="studio lighting">摄影棚光</option>
                                <option value="golden hour">黄金时刻</option>
                                <option value="blue hour">蓝调时刻</option>
                                <option value="dramatic lighting">戏剧性光照</option>
                                <option value="soft lighting">柔和光照</option>
                            </select>
                        </div>

                        <!-- 色彩调色板 -->
                        <div class="parameter-card">
                            <h6><i class="fas fa-palette"></i> 色彩调色板</h6>
                            <select class="form-select" id="colorPalette">
                                <option value="">选择色彩...</option>
                                <option value="vibrant colors">鲜艳色彩</option>
                                <option value="pastel colors">柔和色彩</option>
                                <option value="monochrome">单色调</option>
                                <option value="warm tones">暖色调</option>
                                <option value="cool tones">冷色调</option>
                                <option value="earth tones">大地色调</option>
                            </select>
                        </div>

                        <!-- 相机角度 -->
                        <div class="parameter-card">
                            <h6><i class="fas fa-camera"></i> 相机角度</h6>
                            <select class="form-select" id="cameraAngle">
                                <option value="">选择角度...</option>
                                <option value="eye level">平视角度</option>
                                <option value="low angle">低角度</option>
                                <option value="high angle">高角度</option>
                                <option value="bird's eye view">鸟瞰视角</option>
                                <option value="close-up">特写</option>
                                <option value="wide shot">广角</option>
                            </select>
                        </div>

                        <!-- 特殊选项 -->
                        <div class="parameter-card">
                            <h6><i class="fas fa-magic"></i> 特殊选项</h6>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="tile">
                                <label class="form-check-label" for="tile">
                                    平铺模式 (Tile)
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="weird">
                                <label class="form-check-label" for="weird">
                                    奇异模式 (Weird)
                                </label>
                            </div>
                            <div class="mt-2" id="weirdValueContainer" style="display: none;">
                                <label class="form-label">奇异值 (0-3000)</label>
                                <input type="range" class="range-input" id="weirdValue" 
                                       min="0" max="3000" value="0" 
                                       oninput="updateRangeValue('weirdValue', this.value)">
                                <div class="range-value" id="weirdValueValue">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="text-center mt-4">
                    <button class="btn btn-custom me-3" onclick="buildCommand()">
                        <i class="fas fa-cogs"></i> 构建命令
                    </button>
                    <button class="btn btn-outline-secondary me-3" onclick="resetForm()">
                        <i class="fas fa-undo"></i> 重置
                    </button>
                    <button class="btn btn-outline-primary" onclick="loadDefault()">
                        <i class="fas fa-home"></i> 默认设置
                    </button>
                </div>

                <!-- 加载动画 -->
                <div class="loading-spinner" id="loadingSpinner">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-2">正在构建命令...</p>
                </div>

                <!-- 结果显示 -->
                <div class="result-section" id="resultSection" style="display: none;">
                    <div class="section-title">
                        <i class="fas fa-terminal"></i>
                        生成的命令
                    </div>
                    <div class="command-output" id="commandOutput">
                        <button class="copy-btn" onclick="copyCommand()">
                            <i class="fas fa-copy"></i> 复制
                        </button>
                    </div>
                    
                    <div class="mt-3">
                        <h6><i class="fas fa-info-circle"></i> 使用说明</h6>
                        <p class="text-muted mb-0">
                            复制上面的命令，在 Discord 的 MidJourney 机器人频道中粘贴并发送即可生成图像。
                        </p>
                    </div>
                </div>

                <!-- 错误提示 -->
                <div class="alert alert-danger alert-custom" id="errorAlert" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span id="errorMessage"></span>
                </div>

                <!-- 成功提示 -->
                <div class="alert alert-success alert-custom" id="successAlert" style="display: none;">
                    <i class="fas fa-check-circle"></i>
                    <span id="successMessage"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 自定义 JavaScript -->
    <script src="app.js"></script>
</body>
</html>
