<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项列表</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 我的待办事项</h1>
            <p>记录和管理您的日常任务</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="输入新的任务..." maxlength="100">
                <button id="addBtn" class="btn btn-primary">添加任务</button>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="pending">待办</button>
                <button class="filter-btn" data-filter="in-progress">进行中</button>
                <button class="filter-btn" data-filter="completed">已完成</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="totalTasks">0</span>
                <span class="stat-label">总任务</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="pendingTasks">0</span>
                <span class="stat-label">待办</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="inProgressTasks">0</span>
                <span class="stat-label">进行中</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="completedTasks">0</span>
                <span class="stat-label">已完成</span>
            </div>
        </div>

        <div class="tasks-section">
            <div id="tasksList" class="tasks-list">
                <!-- 任务列表将在这里动态生成 -->
            </div>
        </div>

        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📋</div>
            <h3>暂无任务</h3>
            <p>添加您的第一个任务开始使用吧！</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
