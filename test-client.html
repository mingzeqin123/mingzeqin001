<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 聊天测试客户端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #dc3545;
        }

        .status-dot.connected {
            background: #28a745;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .controls {
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
        }

        .control-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input, select, button {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        input, select {
            flex: 1;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
        }

        .message.sent {
            background: #007bff;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .message.received {
            background: white;
            border: 1px solid #e9ecef;
        }

        .message.system {
            background: #6c757d;
            color: white;
            margin: 0 auto;
            text-align: center;
            max-width: 90%;
            font-size: 12px;
        }

        .message-info {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .typing-indicator {
            padding: 10px 20px;
            font-style: italic;
            color: #6c757d;
            font-size: 12px;
        }

        .input-area {
            padding: 20px;
            background: white;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
        }

        .send-btn {
            padding: 12px 20px;
            background: #28a745;
            border-radius: 25px;
        }

        .send-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WebSocket 聊天测试客户端</h1>
            <p>用于测试聊天服务器功能</p>
        </div>

        <div class="status">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">未连接</span>
            </div>
            <div>
                <span>在线用户: <span id="userCount">0</span></span>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <input type="text" id="serverUrl" placeholder="服务器地址" value="ws://localhost:8080">
                <button onclick="connect()" id="connectBtn">连接</button>
                <button onclick="disconnect()" id="disconnectBtn" disabled>断开</button>
            </div>
            <div class="control-group">
                <input type="text" id="roomId" placeholder="房间ID" value="test-room">
                <input type="text" id="nickname" placeholder="昵称" value="测试用户">
                <button onclick="joinRoom()" id="joinBtn" disabled>加入房间</button>
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="message system">
                欢迎使用WebSocket聊天测试客户端！请先连接服务器并加入房间。
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator"></div>

        <div class="input-area">
            <div class="input-group">
                <input type="text" id="messageInput" placeholder="输入消息..." disabled>
                <button onclick="sendMessage()" id="sendBtn" class="send-btn" disabled>发送</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let connected = false;
        let joined = false;
        let clientId = null;
        let typingTimer = null;

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const userCount = document.getElementById('userCount');
        const messages = document.getElementById('messages');
        const typingIndicator = document.getElementById('typingIndicator');
        const messageInput = document.getElementById('messageInput');

        // 连接服务器
        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            
            if (!serverUrl) {
                alert('请输入服务器地址');
                return;
            }

            try {
                ws = new WebSocket(serverUrl);

                ws.onopen = function() {
                    connected = true;
                    updateStatus('已连接', true);
                    updateButtons();
                    addMessage('system', '已连接到服务器');
                };

                ws.onmessage = function(event) {
                    try {
                        const message = JSON.parse(event.data);
                        handleMessage(message);
                    } catch (error) {
                        console.error('解析消息失败:', error);
                    }
                };

                ws.onclose = function() {
                    connected = false;
                    joined = false;
                    updateStatus('连接已断开', false);
                    updateButtons();
                    addMessage('system', '连接已断开');
                };

                ws.onerror = function(error) {
                    console.error('WebSocket错误:', error);
                    addMessage('system', 'WebSocket连接错误');
                };

            } catch (error) {
                alert('连接失败: ' + error.message);
            }
        }

        // 断开连接
        function disconnect() {
            if (ws) {
                ws.close();
            }
        }

        // 加入房间
        function joinRoom() {
            const roomId = document.getElementById('roomId').value;
            const nickname = document.getElementById('nickname').value;

            if (!roomId || !nickname) {
                alert('请输入房间ID和昵称');
                return;
            }

            if (!connected) {
                alert('请先连接服务器');
                return;
            }

            const message = {
                type: 'join',
                roomId: roomId,
                nickname: nickname,
                avatar: ''
            };

            sendWsMessage(message);
        }

        // 发送消息
        function sendMessage() {
            const content = messageInput.value.trim();
            
            if (!content) return;
            if (!connected || !joined) {
                alert('请先连接服务器并加入房间');
                return;
            }

            const message = {
                type: 'message',
                content: content
            };

            sendWsMessage(message);
            messageInput.value = '';
        }

        // 发送WebSocket消息
        function sendWsMessage(message) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(message));
            }
        }

        // 处理收到的消息
        function handleMessage(message) {
            switch (message.type) {
                case 'connected':
                    clientId = message.clientId;
                    addMessage('system', `客户端ID: ${clientId}`);
                    break;

                case 'joined':
                    joined = true;
                    updateButtons();
                    updateUserCount(message.users.length);
                    addMessage('system', `已加入房间: ${message.roomId}`);
                    break;

                case 'message':
                    const isSelf = message.user.id === clientId;
                    addMessage(isSelf ? 'sent' : 'received', message.content, message.user.nickname);
                    break;

                case 'user_joined':
                    updateUserCount(message.users.length);
                    addMessage('system', `${message.user.nickname} 加入了聊天`);
                    break;

                case 'user_left':
                    updateUserCount(message.users.length);
                    addMessage('system', `${message.user.nickname} 离开了聊天`);
                    break;

                case 'typing':
                    showTyping(message.user.nickname, message.isTyping);
                    break;

                case 'pong':
                    console.log('收到心跳响应');
                    break;
            }
        }

        // 添加消息到列表
        function addMessage(type, content, sender = '') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            let html = '';
            if (type !== 'system' && sender) {
                html += `<div class="message-info">${sender} - ${new Date().toLocaleTimeString()}</div>`;
            }
            html += content;

            messageDiv.innerHTML = html;
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        // 显示输入状态
        function showTyping(username, isTyping) {
            if (isTyping) {
                typingIndicator.textContent = `${username} 正在输入...`;
            } else {
                typingIndicator.textContent = '';
            }
        }

        // 更新状态显示
        function updateStatus(text, isConnected) {
            statusText.textContent = text;
            if (isConnected) {
                statusDot.classList.add('connected');
            } else {
                statusDot.classList.remove('connected');
            }
        }

        // 更新用户数量
        function updateUserCount(count) {
            userCount.textContent = count;
        }

        // 更新按钮状态
        function updateButtons() {
            document.getElementById('connectBtn').disabled = connected;
            document.getElementById('disconnectBtn').disabled = !connected;
            document.getElementById('joinBtn').disabled = !connected;
            document.getElementById('sendBtn').disabled = !connected || !joined;
            messageInput.disabled = !connected || !joined;
        }

        // 输入框事件
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        messageInput.addEventListener('input', function() {
            if (!connected || !joined) return;

            // 发送正在输入状态
            sendWsMessage({
                type: 'typing',
                isTyping: true
            });

            // 清除之前的定时器
            clearTimeout(typingTimer);

            // 设置新的定时器，2秒后发送停止输入状态
            typingTimer = setTimeout(() => {
                sendWsMessage({
                    type: 'typing',
                    isTyping: false
                });
            }, 2000);
        });

        // 页面加载完成后自动聚焦到服务器地址输入框
        window.addEventListener('load', function() {
            document.getElementById('serverUrl').focus();
        });
    </script>
</body>
</html>
