# 应用配置文件
# 用于配置应用的运行时参数

[app]
name = "Jump Jump Game Project"
version = "1.0.0"
environment = "production"
debug = false

[server]
host = "0.0.0.0"
port = 8080
timeout = 30

[build]
# 构建相关配置
schedule = "0 2 * * *"  # 每天凌晨2点
keep_builds = 5         # 保留最近5个构建
auto_deploy = true      # 构建后自动部署

[deploy]
# 部署相关配置
strategy = "rolling"    # 部署策略: rolling, blue-green
backup = true          # 部署前备份
health_check = true    # 部署后健康检查
rollback_on_failure = true  # 失败时自动回滚

[monitoring]
# 监控配置
enabled = true
health_endpoint = "/health"
metrics_endpoint = "/metrics"
log_level = "info"

[notification]
# 通知配置
enabled = false
webhook_url = ""
slack_channel = "#deployments"

[cleanup]
# 清理配置
log_retention_days = 7
build_retention_days = 30
backup_retention_days = 90