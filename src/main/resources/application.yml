server:
  port: 8080

spring:
  application:
    name: redis-distributed-lock
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 5000ms
    jedis:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# 日志配置
logging:
  level:
    com.example: DEBUG
    org.springframework.data.redis: DEBUG