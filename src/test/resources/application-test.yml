spring:
  redis:
    host: localhost
    port: 6379
    password: 
    database: 1  # 使用不同的数据库进行测试
    timeout: 5000ms
    jedis:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# 测试环境日志配置
logging:
  level:
    com.example: DEBUG
    org.springframework.data.redis: DEBUG
    root: INFO