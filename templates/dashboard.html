<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器监控大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            overflow-x: hidden;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .server-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .server-card:hover {
            transform: translateY(-5px);
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .server-name {
            font-size: 1.5em;
            font-weight: bold;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .metric-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #4CAF50;
        }

        .metric-value.warning {
            color: #FF9800;
        }

        .metric-value.danger {
            color: #F44336;
        }

        .chart-container {
            position: relative;
            height: 200px;
            margin-top: 15px;
        }

        .disk-info {
            margin-top: 15px;
        }

        .disk-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .disk-item:last-child {
            border-bottom: none;
        }

        .disk-name {
            font-size: 0.9em;
        }

        .disk-usage {
            font-size: 0.9em;
            color: #4CAF50;
        }

        .disk-usage.warning {
            color: #FF9800;
        }

        .disk-usage.danger {
            color: #F44336;
        }

        .refresh-info {
            text-align: center;
            margin-top: 20px;
            opacity: 0.7;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
        }

        .error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #F44336;
            color: #F44336;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
                padding: 10px;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🖥️ 服务器监控大屏</h1>
        <p>实时监控多台服务器状态</p>
    </div>

    <div id="dashboard" class="dashboard">
        <div class="loading">正在加载服务器数据...</div>
    </div>

    <div class="refresh-info">
        数据每30秒自动刷新 | 最后更新: <span id="lastUpdate">--</span>
    </div>

    <script>
        class ServerDashboard {
            constructor() {
                this.servers = [];
                this.charts = {};
                this.init();
            }

            async init() {
                await this.loadServers();
                this.startAutoRefresh();
            }

            async loadServers() {
                try {
                    const response = await axios.get('/api/servers');
                    this.servers = response.data;
                    this.renderDashboard();
                } catch (error) {
                    console.error('加载服务器列表失败:', error);
                    this.showError('加载服务器列表失败');
                }
            }

            async loadServerMetrics(serverName) {
                try {
                    const response = await axios.get(`/api/metrics/${serverName}`);
                    return response.data;
                } catch (error) {
                    console.error(`加载服务器 ${serverName} 指标失败:`, error);
                    return null;
                }
            }

            async loadServerHistory(serverName) {
                try {
                    const response = await axios.get(`/api/metrics/${serverName}/history?hours=24`);
                    return response.data;
                } catch (error) {
                    console.error(`加载服务器 ${serverName} 历史数据失败:`, error);
                    return [];
                }
            }

            async renderDashboard() {
                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = '';

                if (this.servers.length === 0) {
                    dashboard.innerHTML = '<div class="error">未找到服务器数据</div>';
                    return;
                }

                for (const server of this.servers) {
                    const serverCard = await this.createServerCard(server);
                    dashboard.appendChild(serverCard);
                }
            }

            async createServerCard(server) {
                const card = document.createElement('div');
                card.className = 'server-card';
                card.id = `server-${server.name}`;

                const metrics = await this.loadServerMetrics(server.name);
                if (!metrics) {
                    card.innerHTML = `
                        <div class="server-header">
                            <div class="server-name">${server.name}</div>
                            <div class="status-indicator" style="background: #F44336;"></div>
                        </div>
                        <div class="error">无法获取服务器数据</div>
                    `;
                    return card;
                }

                const cpuUsage = metrics.cpu?.total_usage || 0;
                const memoryUsage = metrics.memory?.usage_percent || 0;
                const diskUsage = this.getMaxDiskUsage(metrics.disk || []);

                card.innerHTML = `
                    <div class="server-header">
                        <div class="server-name">${server.name}</div>
                        <div class="status-indicator"></div>
                    </div>
                    <div class="metrics-grid">
                        <div class="metric-item">
                            <div class="metric-label">CPU使用率</div>
                            <div class="metric-value ${this.getUsageClass(cpuUsage)}">${cpuUsage}%</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">内存使用率</div>
                            <div class="metric-value ${this.getUsageClass(memoryUsage)}">${memoryUsage}%</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">磁盘使用率</div>
                            <div class="metric-value ${this.getUsageClass(diskUsage)}">${diskUsage}%</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">运行时间</div>
                            <div class="metric-value">${this.formatUptime(metrics.system?.uptime_days || 0)}</div>
                        </div>
                    </div>
                    <div class="disk-info">
                        <h4>磁盘使用情况</h4>
                        ${this.renderDiskInfo(metrics.disk || [])}
                    </div>
                    <div class="chart-container">
                        <canvas id="chart-${server.name}"></canvas>
                    </div>
                `;

                // 创建图表
                setTimeout(() => {
                    this.createChart(server.name, metrics);
                }, 100);

                return card;
            }

            getMaxDiskUsage(disks) {
                if (!disks || disks.length === 0) return 0;
                return Math.max(...disks.map(disk => disk.usage_percent || 0));
            }

            getUsageClass(usage) {
                if (usage >= 90) return 'danger';
                if (usage >= 70) return 'warning';
                return '';
            }

            formatUptime(days) {
                if (days < 1) return '< 1天';
                if (days < 7) return `${Math.round(days)}天`;
                const weeks = Math.floor(days / 7);
                const remainingDays = Math.round(days % 7);
                return `${weeks}周${remainingDays}天`;
            }

            renderDiskInfo(disks) {
                if (!disks || disks.length === 0) {
                    return '<div class="error">无磁盘信息</div>';
                }

                return disks.map(disk => {
                    if (disk.error) return '';
                    const usageClass = this.getUsageClass(disk.usage_percent);
                    return `
                        <div class="disk-item">
                            <div class="disk-name">${disk.device}</div>
                            <div class="disk-usage ${usageClass}">
                                ${disk.usage_percent}% (${disk.used}GB / ${disk.total}GB)
                            </div>
                        </div>
                    `;
                }).join('');
            }

            async createChart(serverName, metrics) {
                const canvas = document.getElementById(`chart-${serverName}`);
                if (!canvas) return;

                const history = await this.loadServerHistory(serverName);
                if (history.length === 0) return;

                const labels = history.map(h => {
                    const date = new Date(h.timestamp);
                    return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                });

                const cpuData = history.map(h => h.cpu?.total_usage || 0);
                const memoryData = history.map(h => h.memory?.usage_percent || 0);

                const ctx = canvas.getContext('2d');
                
                // 销毁已存在的图表
                if (this.charts[serverName]) {
                    this.charts[serverName].destroy();
                }

                this.charts[serverName] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'CPU使用率 (%)',
                            data: cpuData,
                            borderColor: '#4CAF50',
                            backgroundColor: 'rgba(76, 175, 80, 0.1)',
                            tension: 0.4,
                            fill: true
                        }, {
                            label: '内存使用率 (%)',
                            data: memoryData,
                            borderColor: '#2196F3',
                            backgroundColor: 'rgba(33, 150, 243, 0.1)',
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: {
                                    color: 'white',
                                    font: {
                                        size: 12
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                ticks: {
                                    color: 'white',
                                    font: {
                                        size: 10
                                    }
                                },
                                grid: {
                                    color: 'rgba(255, 255, 255, 0.1)'
                                }
                            },
                            y: {
                                beginAtZero: true,
                                max: 100,
                                ticks: {
                                    color: 'white',
                                    font: {
                                        size: 10
                                    }
                                },
                                grid: {
                                    color: 'rgba(255, 255, 255, 0.1)'
                                }
                            }
                        }
                    }
                });
            }

            startAutoRefresh() {
                setInterval(() => {
                    this.loadServers();
                    this.updateLastRefreshTime();
                }, 30000); // 30秒刷新一次
            }

            updateLastRefreshTime() {
                const now = new Date();
                document.getElementById('lastUpdate').textContent = 
                    now.toLocaleString('zh-CN');
            }

            showError(message) {
                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = `<div class="error">${message}</div>`;
            }
        }

        // 初始化大屏
        document.addEventListener('DOMContentLoaded', () => {
            new ServerDashboard();
        });
    </script>
</body>
</html>
